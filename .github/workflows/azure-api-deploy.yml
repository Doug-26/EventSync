name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/azure-api-deploy.yml'
  workflow_dispatch:

env:
  WEBAPP_NAME: eventsync-api
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: server/EventSync.Api/EventSync.Api.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test server/EventSync.Api.Tests/EventSync.Api.Tests.csproj -c Release

      # ReadyToRun precompiles IL to native code so the API spends far less time
      # JIT-compiling on startup — noticeable on the shared-CPU F1 plan, where
      # every cold start / recycle also burns the 60 CPU-min/day quota.
      # R2R requires a runtime identifier (App Service is Linux x64); the app
      # stays framework-dependent and uses the platform's .NET runtime.
      - name: Publish (ReadyToRun)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r linux-x64
          --self-contained false
          -p:PublishReadyToRun=true
          -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish