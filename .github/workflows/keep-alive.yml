# Keep-alive ping for the API (App Service F1) — BACKUP pinger only.
#
# The primary keep-alive is an external cron-job.org job hitting /health every
# 5 minutes (see DEPLOYMENT.md §6.8). GitHub throttles high-frequency scheduled
# workflows on free repos: a `*/10` cron was observed firing only every 4–9 h,
# so this workflow cannot keep the API warm on its own.
#
# IMPORTANT — ping /health, NEVER /health/ready:
#   /health is static and never touches SQL. /health/ready opens a DB connection,
#   which resumes the Azure SQL Free (serverless) DB and keeps it online — and
#   billed — for at least the 60-min auto-pause delay. An online DB costs
#   ~1,800 vCore-seconds/hour (0.5 vCore minimum) whether or not it runs queries,
#   so keeping it awake 24/7 burns ~43,200/day and would exhaust the 100,000
#   vCore-second monthly free budget in ~2.3 days. The DB is configured to
#   auto-pause until next month when the budget runs out, which takes the app down.
#   The DB is woken on demand instead: the SPA calls /health/ready on page load.
#
# Cost: GitHub Actions minutes only (a few seconds per run). Zero DB cost.
#
# To pause pinging: disable this workflow in the GitHub Actions UI.
name: Keep API warm (backup)

on:
  schedule:
    # Best effort. GitHub may delay or skip scheduled runs under load.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Guard against overlapping runs if a ping is unusually slow.
concurrency:
  group: keep-alive
  cancel-in-progress: false

# Least-privilege — this workflow only makes an outbound HTTP call.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    # 3 attempts × 30 s max + 2 × 20 s sleeps ≈ 2.2 min worst case.
    timeout-minutes: 5
    env:
      # Production API base URL. Update this if the App Service is renamed.
      API_BASE_URL: https://eventsync-api-h0frhdfsb3gbeth3.southeastasia-01.azurewebsites.net
    steps:
      - name: Ping /health
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/health"
          echo "Pinging $url"

          attempt=1
          max_attempts=3
          status="000"
          while (( attempt <= max_attempts )); do
            status=$(curl -sS -o /tmp/body -w '%{http_code}' \
              --max-time 30 \
              --connect-timeout 15 \
              "$url" || echo "000")
            echo "Attempt $attempt → HTTP $status"
            if [[ "$status" == "200" ]]; then
              cat /tmp/body || true
              echo
              echo "API is warm."
              exit 0
            fi
            attempt=$((attempt + 1))
            if (( attempt <= max_attempts )); then
              sleep 20
            fi
          done

          echo "::warning::Keep-alive ping failed after $max_attempts attempts (last status $status). API may be genuinely down."
          # Exit 0 so a temporary Azure blip does not spam failure notifications.
          exit 0
