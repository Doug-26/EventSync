# Keep-alive ping to prevent Azure free-tier cold starts.
#
# Both the API (App Service F1) and the database (Azure SQL Free Offer) auto-pause
# after periods of inactivity. First-visit UX after a long idle window is bad:
# the initial request can take 30–60 seconds while both tiers resume.
#
# This workflow pings /health/ready every 10 minutes. That endpoint runs a
# lightweight `CanConnectAsync` against SQL so both App Service *and* the DB
# stay warm. Ten-minute cadence sits comfortably under App Service F1's ~20 min
# idle threshold and Azure SQL Free's 60 min auto-pause delay.
#
# Cost:
#   - GitHub Actions minutes: ~10 s/run × 144 runs/day ≈ 24 min/day (well under
#     the 2,000 min/month free budget for public repos it's free anyway).
#   - Azure SQL Free vCore-seconds: <1 s per ping × 4,320 pings/month ≈ 4,000
#     vCore-seconds/month, ~4% of the 100,000 monthly budget.
#
# To pause pinging (e.g. going on holiday): disable this workflow in the
# GitHub Actions UI, or comment out the `schedule:` block below.
name: Keep API warm

on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort; occasional 10–15 min gaps
    # are expected and fine.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Guard against overlapping runs if a ping is unusually slow.
concurrency:
  group: keep-alive
  cancel-in-progress: false

# Least-privilege — this workflow only makes an outbound HTTP call.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Production API base URL. Update this if the App Service is renamed.
      API_BASE_URL: https://eventsync-api-h0frhdfsb3gbeth3.southeastasia-01.azurewebsites.net
    steps:
      - name: Ping /health/ready
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/health/ready"
          echo "Pinging $url"

          # Retry up to 4 times with 30 s backoff. A truly cold instance can
          # need ~30–60 s to answer the first request, so a single curl is
          # not enough for a reliable keep-alive.
          attempt=1
          max_attempts=4
          while (( attempt <= max_attempts )); do
            status=$(curl -sS -o /tmp/body -w '%{http_code}' \
              --max-time 60 \
              --connect-timeout 15 \
              "$url" || echo "000")
            echo "Attempt $attempt → HTTP $status"
            if [[ "$status" == "200" ]]; then
              cat /tmp/body || true
              echo
              echo "API is warm."
              exit 0
            fi
            attempt=$((attempt + 1))
            if (( attempt <= max_attempts )); then
              sleep 30
            fi
          done

          echo "::warning::Keep-alive ping failed after $max_attempts attempts (last status $status). API may be genuinely down."
          # Exit 0 so a temporary Azure blip does not spam failure notifications.
          # The last-status warning is still visible in the run summary.
          exit 0
